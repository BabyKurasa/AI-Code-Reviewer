<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Code Reviewer - Professional Code Analysis Tool</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .app-container {
            display: flex;
            min-height: 100vh;
        }
        
        /* Sidebar Styles */
        .sidebar {
            width: 280px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-right: 1px solid rgba(51, 65, 85, 0.5);
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            color: white;
        }
        
        .sidebar-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .sidebar-header .icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        
        .sidebar-header h2 {
            font-size: 20px;
            margin-bottom: 5px;
        }
        
        .sidebar-header p {
            font-size: 12px;
            opacity: 0.7;
        }
        
        .stat-section {
            margin-bottom: 30px;
        }
        
        .stat-section h3 {
            font-size: 14px;
            margin-bottom: 12px;
            font-weight: 600;
        }
        
        .stat-box {
            background: rgba(30, 41, 59, 0.8);
            padding: 12px;
            border-radius: 10px;
        }
        
        .stat-box p {
            margin: 5px 0;
            font-size: 14px;
        }
        
        .clear-btn {
            width: 100%;
            margin-top: 10px;
            padding: 8px;
            background: #dc2626;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .clear-btn:hover {
            background: #b91c1c;
        }
        
        .history-item {
            background: rgba(30, 41, 59, 0.8);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 12px;
        }
        
        .history-item strong {
            display: block;
            margin-bottom: 4px;
        }
        
        .history-item small {
            opacity: 0.7;
        }
        
        /* Main Content Styles */
        .main-content {
            margin-left: 280px;
            flex: 1;
            min-height: 100vh;
        }
        
        /* Header Styles */
        .header {
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px);
            padding: 16px 24px;
            border-bottom: 1px solid #334155;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        
        .language-select {
            padding: 10px 16px;
            border-radius: 10px;
            background: #334155;
            color: white;
            border: 1px solid #475569;
            cursor: pointer;
            font-size: 14px;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 10px 20px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59,130,246,0.4);
        }
        
        .btn-danger {
            background: #ef4444;
            color: white;
        }
        
        .btn-danger:hover {
            background: #dc2626;
        }
        
        .btn-secondary {
            background: #334155;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #475569;
        }
        
        /* Content Area */
        .content {
            padding: 24px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }
        
        .stat-card {
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #334155;
            color: white;
        }
        
        .stat-card p:first-child {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 8px;
        }
        
        .stat-card .stat-value {
            font-size: 32px;
            font-weight: bold;
        }
        
        /* Editor Grid */
        .editor-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }
        
        .editor-card, .results-card {
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 1px solid #334155;
            overflow: hidden;
        }
        
        .card-header {
            padding: 16px 20px;
            border-bottom: 1px solid #334155;
            font-weight: 600;
            color: white;
            background: rgba(15, 23, 42, 0.5);
        }
        
        .editor-container {
            height: 500px;
            width: 100%;
            padding: 16px;
            background: #0f172a;
            color: #e2e8f0;
            border: none;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            resize: vertical;
        }
        
        .results-container {
            padding: 20px;
            max-height: 550px;
            overflow-y: auto;
        }
        
        /* Results Styles */
        .status-badge {
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 500;
        }
        
        .status-success {
            background: #dcfce7;
            color: #16a34a;
        }
        
        .status-error {
            background: #fee2e2;
            color: #dc2626;
        }
        
        .complexity-box {
            margin-bottom: 20px;
        }
        
        .complexity-box strong {
            color: white;
        }
        
        .complexity-value {
            margin-top: 8px;
            padding: 12px;
            background: #1e293b;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
        }
        
        .complexity-simple { color: #10b981; }
        .complexity-moderate { color: #f59e0b; }
        .complexity-complex { color: #ef4444; }
        
        .score-section {
            margin-bottom: 20px;
        }
        
        .score-section strong {
            color: white;
        }
        
        .score-value {
            font-size: 36px;
            font-weight: bold;
            margin: 8px 0;
        }
        
        .quality-bar {
            height: 8px;
            background: #1e293b;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 8px;
        }
        
        .quality-fill {
            height: 100%;
            transition: width 0.5s ease;
            border-radius: 4px;
        }
        
        .score-good { color: #10b981; }
        .score-average { color: #f59e0b; }
        .score-bad { color: #ef4444; }
        
        .suggestions-list, .bugs-list {
            margin-bottom: 20px;
        }
        
        .suggestions-list h3, .bugs-list h3 {
            color: white;
            font-size: 14px;
            margin-bottom: 12px;
        }
        
        .suggestion-item {
            padding: 12px;
            background: #1e293b;
            border-radius: 10px;
            margin-bottom: 8px;
            border-left: 3px solid #3b82f6;
            color: #cbd5e1;
            font-size: 13px;
        }
        
        .bug-item {
            padding: 12px;
            background: #1e293b;
            border-radius: 10px;
            margin-bottom: 8px;
            border-left: 3px solid #ef4444;
            color: #fca5a5;
            font-size: 13px;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
        }
        
        .empty-state .emoji {
            font-size: 48px;
            margin-bottom: 16px;
        }
        
        .loading-state {
            text-align: center;
            padding: 60px 20px;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid #334155;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .detected-badge {
            background: #10b981;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin-left: 10px;
            display: inline-block;
        }
        
        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }
            .main-content {
                margin-left: 0;
            }
            .editor-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="icon">🤖</div>
                <h2>AI Code Reviewer</h2>
                <p>Professional Code Analysis</p>
            </div>
            
            <div class="stat-section">
                <h3>📊 Statistics</h3>
                <div class="stat-box">
                    <p>Total Reviews: <strong id="reviewCount">0</strong></p>
                    <button class="clear-btn" onclick="clearAllHistory()">Clear All History</button>
                </div>
            </div>
            
            <div class="stat-section" id="historySection">
                <h3>📜 Recent Reviews</h3>
                <div id="historyList"></div>
            </div>
        </div>
        
        <!-- Main Content -->
        <div class="main-content">
            <!-- Header -->
            <div class="header">
                <div class="header-content">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <select id="languageSelect" class="language-select">
                            <option value="auto">🔍 Auto Detect</option>
                            <option value="python">🐍 Python</option>
                            <option value="javascript">📜 JavaScript</option>
                            <option value="java">☕ Java</option>
                            <option value="csharp">🔷 C#</option>
                            <option value="cpp">⚙️ C++</option>
                            <option value="go">🐹 Go</option>
                            <option value="rust">🦀 Rust</option>
                            <option value="ruby">💎 Ruby</option>
                        </select>
                        <span id="detectedBadge" class="detected-badge" style="display: none;"></span>
                    </div>
                    
                    <div class="button-group">
                        <button class="btn btn-primary" onclick="loadExample()">📝 Example</button>
                        <button class="btn btn-secondary" onclick="clearCode()">🗑️ Clear</button>
                        <button class="btn btn-primary" onclick="analyzeCode()" id="reviewBtn">🚀 Review Code</button>
                    </div>
                </div>
            </div>
            
            <!-- Content -->
            <div class="content">
                <div class="stats-grid" id="statsGrid">
                    <div class="stat-card">
                        <p>Total Reviews</p>
                        <div class="stat-value" id="statTotal">0</div>
                    </div>
                    <div class="stat-card">
                        <p>Quality Score</p>
                        <div class="stat-value" id="statQuality">0%</div>
                    </div>
                    <div class="stat-card">
                        <p>Suggestions</p>
                        <div class="stat-value" id="statSuggestions">0</div>
                    </div>
                </div>
                
                <div class="editor-grid">
                    <!-- Code Editor -->
                    <div class="editor-card">
                        <div class="card-header">📝 Code Editor <span id="editorLangLabel">(PYTHON)</span></div>
                        <textarea id="codeInput" class="editor-container" placeholder="Write or paste your code here..."></textarea>
                    </div>
                    
                    <!-- Results Panel -->
                    <div class="results-card">
                        <div class="card-header">🧠 AI Analysis Results</div>
                        <div class="results-container" id="resultsContainer">
                            <div class="empty-state">
                                <div class="emoji">✨</div>
                                <p>Select a language, write code, and click "Review Code"</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let reviewHistory = [];
        let currentResult = null;
        
        // Load history from localStorage
        function loadHistory() {
            const saved = localStorage.getItem('codeReviews');
            if (saved) {
                reviewHistory = JSON.parse(saved);
                updateHistoryDisplay();
                updateStats();
            }
        }
        
        // Save history to localStorage
        function saveHistory() {
            localStorage.setItem('codeReviews', JSON.stringify(reviewHistory.slice(0, 10)));
            updateHistoryDisplay();
            updateStats();
        }
        
        // Update history display
        function updateHistoryDisplay() {
            const historyList = document.getElementById('historyList');
            if (reviewHistory.length === 0) {
                historyList.innerHTML = '<div class="history-item" style="text-align: center; opacity: 0.7;">No reviews yet</div>';
                return;
            }
            
            historyList.innerHTML = reviewHistory.slice(0, 5).map(review => `
                <div class="history-item">
                    <strong>${review.language}</strong>
                    <small>${review.date}</small>
                    <div>Score: ${review.score}% | ${review.complexity}</div>
                </div>
            `).join('');
        }
        
        // Update stats
        function updateStats() {
            document.getElementById('reviewCount').innerText = reviewHistory.length;
            document.getElementById('statTotal').innerText = reviewHistory.length;
            
            if (currentResult) {
                document.getElementById('statQuality').innerText = currentResult.score + '%';
                document.getElementById('statSuggestions').innerText = currentResult.suggestionsCount || 0;
            }
        }
        
        // Clear all history
        function clearAllHistory() {
            reviewHistory = [];
            saveHistory();
            showToast('All history cleared', 'info');
        }
        
        // Show toast notification
        function showToast(message, type) {
            const toast = document.createElement('div');
            toast.textContent = message;
            toast.style.position = 'fixed';
            toast.style.bottom = '20px';
            toast.style.right = '20px';
            toast.style.padding = '12px 20px';
            toast.style.borderRadius = '10px';
            toast.style.backgroundColor = type === 'success' ? '#10b981' : (type === 'error' ? '#ef4444' : '#3b82f6');
            toast.style.color = 'white';
            toast.style.zIndex = '1000';
            toast.style.animation = 'fadeIn 0.3s ease';
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
        
        // Auto-detect language
        function detectLanguage(code) {
            if (!code.trim()) return '';
            
            const patterns = {
                python: /def |print\(|import |from |class .*:|input\(/,
                javascript: /function |const |let |=>|console\.log/,
                java: /public class |System\.out\.println|void main/,
                csharp: /using System;|Console\.WriteLine|namespace /,
                cpp: /#include <iostream>|using namespace std|cout <</,
                go: /package main|func main|fmt\.Println/,
                rust: /fn main\(\)|println!|let mut/,
                ruby: /def |end$|puts |require /
            };
            
            for (const [lang, pattern] of Object.entries(patterns)) {
                if (pattern.test(code)) {
                    return lang;
                }
            }
            return '';
        }
        
        // Update language display
        function updateLanguageDisplay() {
            const select = document.getElementById('languageSelect');
            const code = document.getElementById('codeInput').value;
            const badge = document.getElementById('detectedBadge');
            
            if (select.value === 'auto') {
                const detected = detectLanguage(code);
                if (detected) {
                    badge.style.display = 'inline-block';
                    badge.textContent = `Detected: ${detected}`;
                    document.getElementById('editorLangLabel').innerHTML = `(${detected.toUpperCase()})`;
                } else {
                    badge.style.display = 'none';
                    document.getElementById('editorLangLabel').innerHTML = `(AUTO)`;
                }
            } else {
                badge.style.display = 'none';
                document.getElementById('editorLangLabel').innerHTML = `(${select.value.toUpperCase()})`;
            }
        }
        
        // Examples
        const examples = {
            python: `def fibonacci(n):
    if n <= 1:
        return n
    return fibonacci(n-1) + fibonacci(n-2)

print(fibonacci(10))`,
            javascript: `function fibonacci(n) {
    if (n <= 1) return n;
    return fibonacci(n-1) + fibonacci(n-2);
}
console.log(fibonacci(10));`,
            java: `public class Main {
    public static int fibonacci(int n) {
        if (n <= 1) return n;
        return fibonacci(n-1) + fibonacci(n-2);
    }
    public static void main(String[] args) {
        System.out.println(fibonacci(10));
    }
}`,
            csharp: `using System;
class Program {
    static int Fibonacci(int n) {
        if (n <= 1) return n;
        return Fibonacci(n-1) + Fibonacci(n-2);
    }
    static void Main() {
        Console.WriteLine(Fibonacci(10));
    }
}`,
            cpp: `#include <iostream>
using namespace std;
int fibonacci(int n) {
    if (n <= 1) return n;
    return fibonacci(n-1) + fibonacci(n-2);
}
int main() {
    cout << fibonacci(10) << endl;
    return 0;
}`,
            go: `package main
import "fmt"
func fibonacci(n int) int {
    if n <= 1 { return n }
    return fibonacci(n-1) + fibonacci(n-2)
}
func main() {
    fmt.Println(fibonacci(10));
}`,
            rust: `fn fibonacci(n: u32) -> u32 {
    match n {
        0 => 0,
        1 => 1,
        _ => fibonacci(n-1) + fibonacci(n-2),
    }
}
fn main() {
    println!("{}", fibonacci(10));
}`,
            ruby: `def fibonacci(n)
    return n if n <= 1
    fibonacci(n-1) + fibonacci(n-2)
end
puts fibonacci(10)`
        };
        
        function loadExample() {
            const select = document.getElementById('languageSelect');
            let lang = select.value;
            
            if (lang === 'auto') {
                lang = 'python';
            }
            
            const example = examples[lang];
            if (example) {
                document.getElementById('codeInput').value = example;
                updateLanguageDisplay();
                showToast('Example loaded!', 'success');
            }
        }
        
        function clearCode() {
            document.getElementById('codeInput').value = '';
            document.getElementById('resultsContainer').innerHTML = `
                <div class="empty-state">
                    <div class="emoji">✨</div>
                    <p>Select a language, write code, and click "Review Code"</p>
                </div>
            `;
            showToast('Editor cleared', 'info');
        }
        
        function analyzeCode() {
            const code = document.getElementById('codeInput').value;
            let language = document.getElementById('languageSelect').value;
            
            if (!code.trim()) {
                showToast('Please write some code to review', 'error');
                return;
            }
            
            if (language === 'auto') {
                language = detectLanguage(code);
                if (!language) {
                    showToast('Could not detect language. Please select manually.', 'error');
                    return;
                }
            }
            
            // Show loading
            document.getElementById('resultsContainer').innerHTML = `
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p style="color: #94a3b8;">Analyzing your code...</p>
                </div>
            `;
            
            setTimeout(() => {
                const analysis = performAnalysis(code, language);
                displayResults(analysis, language);
                
                // Save to history
                const newReview = {
                    id: Date.now(),
                    language: language,
                    date: new Date().toLocaleString(),
                    score: analysis.score,
                    complexity: analysis.complexity
                };
                reviewHistory.unshift(newReview);
                saveHistory();
                currentResult = analysis;
                updateStats();
                
                showToast('Analysis complete!', 'success');
            }, 500);
        }
        
        function performAnalysis(code, language) {
            const bugs = [];
            const suggestions = [];
            let score = 85;
            const lines = code.split('\n').length;
            
            // Language-specific checks
            if (language === 'python') {
                if (code.includes('/ 0') || code.includes('/0')) {
                    bugs.push("Division by zero detected! This will crash.");
                    score -= 25;
                }
                if (code.includes('input(') && !code.includes('try')) {
                    suggestions.push("Add try/except blocks to handle user input errors");
                }
                if (!code.includes('#') && code.length > 200) {
                    suggestions.push("Add comments to explain complex logic");
                }
                if (code.includes('except:') && !code.includes('Exception')) {
                    bugs.push("Bare except clause - specify exception type");
                    score -= 10;
                }
            }
            else if (language === 'javascript') {
                if (code.includes('var ')) {
                    bugs.push("Using 'var' - use 'let' or 'const' instead");
                    score -= 5;
                }
                if (code.includes('==') && !code.includes('===')) {
                    bugs.push("Use === for strict equality");
                    score -= 10;
                }
                if (code.includes('console.log')) {
                    suggestions.push("Remove console.log in production");
                }
            }
            else if (language === 'csharp') {
                if (code.includes('Console.WriteLine') && !code.includes('using System;')) {
                    bugs.push("Missing 'using System;' statement");
                    score -= 15;
                }
            }
            
            // Check for unmatched braces
            const openBraces = (code.match(/\{/g) || []).length;
            const closeBraces = (code.match(/\}/g) || []).length;
            if (openBraces !== closeBraces) {
                bugs.push(`Unmatched braces: ${openBraces} opening { but ${closeBraces} closing }`);
                score -= 15;
            }
            
            // Complexity
            let complexity = "Simple";
            if (lines > 20) complexity = "Moderate";
            if (lines > 40) complexity = "Complex";
            
            if (suggestions.length === 0) {
                suggestions.push("Code looks good! Consider adding unit tests");
                suggestions.push("Add comments for better maintainability");
            }
            
            if (bugs.length === 0) {
                bugs.push("No critical bugs detected. Well done!");
            }
            
            score = Math.max(0, Math.min(100, score));
            
            return { complexity, score, bugs, suggestions, lines, suggestionsCount: suggestions.length };
        }
        
        function displayResults(analysis, language) {
            const qualityColor = analysis.score >= 80 ? '#10b981' : (analysis.score >= 60 ? '#f59e0b' : '#ef4444');
            const complexityClass = `complexity-${analysis.complexity.toLowerCase()}`;
            
            const html = `
                <div class="status-badge status-success">
                    ✅ Analysis Complete
                </div>
                
                <div class="complexity-box">
                    <strong>📊 Complexity:</strong>
                    <div class="complexity-value ${complexityClass}">${analysis.complexity}</div>
                </div>
                
                <div class="score-section">
                    <strong>🎯 Quality Score:</strong>
                    <div class="score-value ${analysis.score >= 80 ? 'score-good' : (analysis.score >= 60 ? 'score-average' : 'score-bad')}">${analysis.score}/100</div>
                    <div class="quality-bar">
                        <div class="quality-fill" style="width: ${analysis.score}%; background: ${qualityColor};"></div>
                    </div>
                </div>
                
                <div class="suggestions-list">
                    <h3>💡 Suggestions</h3>
                    ${analysis.suggestions.map(s => `<div class="suggestion-item">${s}</div>`).join('')}
                </div>
                
                <div class="bugs-list">
                    <h3>🐛 Issues Detected</h3>
                    ${analysis.bugs.map(b => `<div class="bug-item">${b}</div>`).join('')}
                </div>
            `;
            
            document.getElementById('resultsContainer').innerHTML = html;
        }
        
        // Event listeners
        document.getElementById('languageSelect').addEventListener('change', updateLanguageDisplay);
        document.getElementById('codeInput').addEventListener('input', updateLanguageDisplay);
        
        // Initialize
        loadHistory();
        updateLanguageDisplay();
        
        // Load example on page load
        setTimeout(() => loadExample(), 100);
